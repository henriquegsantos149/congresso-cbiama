<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/webp" href="/favicon.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Pesquisa de Opinião - Congresso Brasileiro de Inteligência Artificial Aplicada ao Meio Ambiente.">
  <title>Pesquisa de Satisfação - CBIA.MA 2026</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#010A15',
              white: '#F2F2F2',
              green1: '#038C4C',
              green2: '#034959',
              teal: '#038C4C',
              deep: '#6FA638',
            }
          },
          fontFamily: {
            display: ['"Outfit"', 'sans-serif'],
            body: ['"Montserrat"', 'sans-serif'],
            impact: ['"Outfit"', 'sans-serif'],
          },
          backgroundImage: {
            'brand-gradient': 'linear-gradient(90deg, #038C4C 0%, #034959 100%)',
            'brand-gradient-hover': 'linear-gradient(90deg, #034959 0%, #038C4C 100%)',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    /* BASE STYLES */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #010A15;
      color: #F2F2F2;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .carto-grid-subtle {
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .brand-gradient-bg {
      background: linear-gradient(90deg, #038C4C 0%, #034959 100%);
      transition: all 0.3s ease;
    }

    .brand-gradient-bg:hover {
      background: linear-gradient(90deg, #034959 0%, #038C4C 100%);
      box-shadow: 0 0 20px rgba(3, 140, 76, 0.4);
    }

    /* CARD GLASSMORPHISM */
    .glass-card {
      background: rgba(1, 10, 21, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(3, 140, 76, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(3, 140, 76, 0.08);
      border-radius: 24px;
    }

    /* OPTION CARDS */
    .option-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .option-card:hover {
      background: rgba(3, 140, 76, 0.12);
      border-color: rgba(3, 140, 76, 0.5);
      transform: translateY(-2px);
    }

    .option-card.selected {
      background: rgba(3, 140, 76, 0.25);
      border-color: #038C4C;
      box-shadow: 0 0 15px rgba(3, 140, 76, 0.3);
    }

    .option-key-badge {
      font-family: 'Outfit', sans-serif;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .option-card.selected .option-key-badge {
      background: #038C4C;
      color: #FFFFFF;
      border-color: #6FA638;
    }

    /* STEP TRANSITIONS */
    .step-content {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .step-enter {
      opacity: 0;
      transform: translateX(30px);
    }

    .step-enter-back {
      opacity: 0;
      transform: translateX(-30px);
    }

    .step-active {
      opacity: 1;
      transform: translateX(0);
    }

    .step-exit {
      opacity: 0;
      transform: translateX(-30px);
    }

    .step-exit-back {
      opacity: 0;
      transform: translateX(30px);
    }

    /* INPUT STYLES */
    .form-input-glass {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      transition: all 0.3s ease;
    }

    .form-input-glass:focus {
      outline: none;
      border-color: #038C4C;
      background: rgba(3, 140, 76, 0.08);
      box-shadow: 0 0 15px rgba(3, 140, 76, 0.25);
    }
  </style>
</head>

<body class="carto-grid-subtle relative min-h-screen">

  <!-- Ambient Light Orbs -->
  <div class="fixed top-1/4 -left-32 w-96 h-96 bg-brand-green1/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-1/4 -right-32 w-96 h-96 bg-brand-green2/25 rounded-full blur-3xl pointer-events-none"></div>

  <!-- HEADER -->
  <header class="w-full bg-[#010A15]/80 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center">
        <img src="/logo.webp" alt="Logo do Congresso" class="h-12 sm:h-14 object-contain" width="220" height="60" />
      </div>

      <!-- Header actions / info -->
      <div class="flex items-center gap-4">
        <span id="step-counter-text" class="text-xs font-semibold uppercase tracking-wider text-brand-deep">
          Pergunta 1 de 13
        </span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8 relative z-10">
    <div class="w-full max-w-2xl">
      
      <!-- FORM CARD CONTAINER -->
      <div class="glass-card p-6 sm:p-10 relative overflow-hidden">

        <!-- PROGRESS BAR -->
        <div class="w-full bg-white/10 h-2 rounded-full mb-8 overflow-hidden">
          <div id="progress-bar" class="h-full brand-gradient-bg transition-all duration-500 ease-out" style="width: 7.69%;"></div>
        </div>

        <!-- FORM STEP CONTENT -->
        <div id="form-container" class="step-content step-active">
          <!-- Dynamic Question Content Rendered via JS -->
        </div>

        <!-- NAVIGATION CONTROLS -->
        <div id="nav-controls" class="mt-8 pt-6 border-t border-white/10 flex items-center justify-between">
          <button id="btn-prev" onclick="prevQuestion()"
            class="px-5 py-2.5 rounded-xl border border-white/20 text-white/80 hover:text-white hover:border-brand-green1 transition-all text-xs font-semibold uppercase tracking-wider disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:border-white/20">
            ← Anterior
          </button>

          <div class="flex items-center gap-3">
            <span class="text-[11px] text-white/40 hidden sm:inline">Pressione <kbd class="px-1.5 py-0.5 bg-white/10 rounded border border-white/20 text-white/70">Enter ↵</kbd></span>
            <button id="btn-next" onclick="nextQuestion()"
              class="brand-gradient-bg px-7 py-3 rounded-xl text-white font-bold text-xs uppercase tracking-widest hover:-translate-y-0.5 transition-all shadow-lg flex items-center gap-2">
              <span id="btn-next-text">Próximo</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </button>
          </div>
        </div>

      </div>

      <!-- Helper info footer -->
      <div class="mt-4 text-center">
        <p class="text-xs text-white/40">
          Congresso Brasileiro de IA Aplicada ao Meio Ambiente • 15 de Agosto de 2026
        </p>
      </div>

    </div>
  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // ============================================================
    // CONFIGURAÇÃO DO GOOGLE APPS SCRIPT WEB APP
    // Cole aqui a URL gerada no Apps Script (ex: https://script.google.com/macros/s/.../exec)
    // ============================================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwBgodRLxAlajV-tvQkLqeEomrqmeohDawRifhyM4DLKQ4VC87fqsgb6HVT9cltB8eJXA/exec";

    // ============================================================
    // QUESTIONS CONFIGURATION
    // ============================================================
    const questions = [
      {
        id: 1,
        title: "Como você avalia o congresso como um todo?",
        description: "Selecione a opção que melhor descreve sua avaliação geral.",
        type: "single",
        options: [
          "Excelente",
          "Muito Bom",
          "Bom",
          "Ruim",
          "Péssimo"
        ],
        required: true
      },
      {
        id: 2,
        title: "De 1 a 5, como avalia a estrutura do local do congresso?",
        type: "rating",
        min: 1,
        max: 5,
        required: true
      },
      {
        id: 3,
        title: "De 1 a 5, como avalia o coffee break?",
        type: "rating",
        min: 1,
        max: 5,
        required: true
      },
      {
        id: 4,
        title: `<strong class="font-bold text-white">Victor Valente</strong><span class="font-normal text-white/80"> — Consultoria Ambiental 5.0: como a IA está redefinindo o mercado e tornando a atuação mais segura, ágil e lucrativa</span>`,
        description: "Sobre as palestras, avalie de 1 a 5",
        type: "rating",
        min: 1,
        max: 5,
        required: false
      },
      {
        id: 5,
        title: `<strong class="font-bold text-white">Hermann Fernandes</strong><span class="font-normal text-white/80"> — O ativo ambiental invisível: Transformando dados em capacidade de decisão e em base sólida pra IA</span>`,
        description: "Sobre as palestras, avalie de 1 a 5",
        type: "rating",
        min: 1,
        max: 5,
        required: false
      },
      {
        id: 6,
        title: `<strong class="font-bold text-white">Gabriela Luchetti</strong><span class="font-normal text-white/80"> — Predição de cenários futuros do uso da terra com IA</span>`,
        description: "Sobre as palestras, avalie de 1 a 5",
        type: "rating",
        min: 1,
        max: 5,
        required: false
      },
      {
        id: 7,
        title: `<strong class="font-bold text-white">Henrique Gonzalez</strong><span class="font-normal text-white/80"> — Geotecnologias e IA: Estratégias Práticas para Profissionais de Vanguarda</span>`,
        description: "Sobre as palestras, avalie de 1 a 5",
        type: "rating",
        min: 1,
        max: 5,
        required: false
      },
      {
        id: 8,
        title: `<strong class="font-bold text-white">Vinícius Ragghianti</strong><span class="font-normal text-white/80"> — Da simulação à decisão: Gêmeos Digitais, IA e governança ambiental</span>`,
        description: "Sobre as palestras, avalie de 1 a 5",
        type: "rating",
        min: 1,
        max: 5,
        required: false
      },
      {
        id: 9,
        title: "Qual foi a sua palestra favorita?",
        type: "single",
        options: [
          "Victor Valente - Consultoria Ambiental 5.0: como a IA está redefinindo o mercado e tornando a atuação mais segura, ágil e lucrativa",
          "Hermann Fernandes - O ativo ambiental invisível: Transformando dados em capacidade de decisão e em base sólida pra IA",
          "Gabriela Luchetti - Predição de cenários futuros do uso da terra com IA",
          "Henrique Gonzalez - Geotecnologias e IA: Estratégias Práticas para Profissionais de Vanguarda",
          "Vinícius Ragghianti - Da simulação à decisão: Gêmeos Digitais, IA e governança ambiental"
        ],
        required: false
      },
      {
        id: 10,
        title: "Qual foi o melhor momento desse congresso para você?",
        type: "textarea",
        placeholder: "Sua resposta...",
        required: false
      },
      {
        id: 11,
        title: "Qual foi a maior contribuição que você recebeu nesse congresso?",
        type: "textarea",
        placeholder: "Sua resposta...",
        required: false
      },
      {
        id: 12,
        title: "O que acha que pode ser melhorado, modificado, incluído ou removido no congresso para que sua experiência seja ainda melhor?",
        type: "textarea",
        placeholder: "Sua resposta...",
        required: false
      },
      {
        id: 13,
        title: "Caso você tenha algum comentário que não tenha sido contemplado nas perguntas anteriores, deixe ele abaixo.",
        type: "textarea",
        placeholder: "Sua resposta...",
        required: false
      }
    ];

    // STATE VARIABLES
    let currentStep = -1;
    const answers = {};

    // DOM ELEMENTS
    const formContainer = document.getElementById('form-container');
    const progressBar = document.getElementById('progress-bar');
    const stepCounterText = document.getElementById('step-counter-text');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnNextText = document.getElementById('btn-next-text');
    const navControls = document.getElementById('nav-controls');

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      if (currentStep === -1) {
        renderWelcomeScreen();
      } else {
        renderQuestion(currentStep);
      }
    });

    // RENDER WELCOME SCREEN
    function renderWelcomeScreen(direction = 'next') {
      progressBar.style.width = `0%`;
      stepCounterText.textContent = `Pesquisa de Satisfação`;
      navControls.style.display = 'none';

      formContainer.className = `step-content ${direction === 'next' ? 'step-enter' : 'step-enter-back'}`;

      setTimeout(() => {
        formContainer.innerHTML = `
          <div class="text-center py-4">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-brand-green1/20 border border-brand-green1/40 text-brand-deep text-xs font-bold uppercase tracking-widest mb-6">
              <span>Pesquisa Anônima de Satisfação - CBIA.MA 2026</span>
            </div>

            <h1 class="text-xl sm:text-2xl font-bold font-display text-white mb-5 leading-snug">
              Encerramos com êxito o I Congresso Brasileiro de Inteligência Artificial Aplicada ao Meio Ambiente.
            </h1>

            <div class="space-y-4 text-sm sm:text-base text-white/80 max-w-xl mx-auto mb-8 leading-relaxed text-center">
              <p>
                Com o compromisso de aprimorar cada vez mais o evento, a Comissão Organizadora já iniciou o planejamento da próxima edição.
              </p>
              <p>
                Esta é uma <strong>pesquisa 100% anônima</strong>. Para isso, contamos com a sua avaliação — reserve alguns minutos para compartilhar sua experiência e sugestões. Seu feedback é essencial para o fortalecimento do congresso.
              </p>
              <p class="font-semibold text-brand-deep text-center pt-1">
                Agradecemos sua contribuição. Vamos pra cima! 🚀
              </p>
            </div>

            <button onclick="startSurvey()"
              class="brand-gradient-bg px-8 py-4 rounded-xl text-white font-bold text-sm uppercase tracking-widest hover:scale-105 transition-all shadow-xl flex items-center justify-center gap-3 w-full sm:w-auto mx-auto cursor-pointer">
              <span>Iniciar Pesquisa</span>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </button>
          </div>
        `;
        formContainer.className = 'step-content step-active';
      }, 50);
    }

    function startSurvey() {
      currentStep = 0;
      navControls.style.display = 'flex';
      renderQuestion(0, 'next');
    }

    // RENDER QUESTION FUNCTION
    function renderQuestion(stepIndex, direction = 'next') {
      navControls.style.display = 'flex';
      const q = questions[stepIndex];
      const isLast = stepIndex === questions.length - 1;
      const progressPercent = ((stepIndex + 1) / questions.length) * 100;

      // Update Header & Progress
      progressBar.style.width = `${progressPercent}%`;
      stepCounterText.textContent = `Pergunta ${stepIndex + 1} de ${questions.length}`;

      // Update Nav Buttons State
      btnPrev.disabled = false;
      btnNextText.textContent = isLast ? "Finalizar" : "Próximo";

      // Animation classes
      formContainer.className = `step-content ${direction === 'next' ? 'step-enter' : 'step-enter-back'}`;

      setTimeout(() => {
        let html = `
          <div class="mb-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-green1/20 border border-brand-green1/30 text-brand-deep text-xs font-bold uppercase tracking-widest mb-3">
              <span>Pergunta ${q.id}</span>
            </div>
            ${q.description ? `<p class="text-sm sm:text-base text-white/70 mb-3 font-medium">${q.description}</p>` : ''}
            <h2 class="text-xl sm:text-2xl font-display text-white mb-2 leading-tight">
              ${q.title}
            </h2>
          </div>
        `;

        // Render depending on question type
        if (q.type === 'single') {
          const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
          html += `<div class="space-y-2.5">`;
          q.options.forEach((opt, idx) => {
            const isSelected = answers[q.id] === opt;
            const letter = letters[idx] || (idx + 1);
            html += `
              <div onclick="selectSingleOption('${q.id}', '${escapeHtml(opt)}', this)" 
                class="option-card p-3.5 sm:p-4 rounded-xl flex items-start gap-3 ${isSelected ? 'selected' : ''}">
                <span class="option-key-badge shrink-0 w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold text-white/70 mt-0.5">
                  ${letter}
                </span>
                <span class="text-xs sm:text-sm font-medium text-white/90 leading-relaxed flex-1">${opt}</span>
              </div>
            `;
          });
          html += `</div>`;
        } 
        else if (q.type === 'text') {
          const val = answers[q.id] || '';
          html += `
            <div class="mt-4">
              <input type="text" id="input-q-${q.id}" value="${escapeHtml(val)}" placeholder="${q.placeholder || ''}"
                oninput="saveAnswer('${q.id}', this.value)"
                class="form-input-glass w-full px-5 py-4 rounded-xl text-base placeholder-white/40 font-medium" autofocus />
            </div>
          `;
        }
        else if (q.type === 'contact') {
          const valEmail = answers[`${q.id}_email`] || '';
          const valPhone = answers[`${q.id}_phone`] || '';
          html += `
            <div class="space-y-4 mt-4">
              <div>
                <label class="block text-xs uppercase tracking-wider text-white/70 mb-1 font-semibold">E-mail Comercial/Pessoal</label>
                <input type="email" id="input-q-${q.id}-email" value="${escapeHtml(valEmail)}" placeholder="${q.placeholderEmail || ''}"
                  oninput="saveAnswer('${q.id}_email', this.value)"
                  class="form-input-glass w-full px-5 py-3.5 rounded-xl text-sm placeholder-white/40 font-medium" />
              </div>
              <div>
                <label class="block text-xs uppercase tracking-wider text-white/70 mb-1 font-semibold">WhatsApp (com DDD)</label>
                <input type="tel" id="input-q-${q.id}-phone" value="${escapeHtml(valPhone)}" placeholder="${q.placeholderPhone || ''}"
                  oninput="saveAnswer('${q.id}_phone', this.value)"
                  class="form-input-glass w-full px-5 py-3.5 rounded-xl text-sm placeholder-white/40 font-medium" />
              </div>
            </div>
          `;
        }
        else if (q.type === 'multiple') {
          const selectedList = answers[q.id] || [];
          html += `<div class="space-y-3">`;
          q.options.forEach((opt) => {
            const isSelected = selectedList.includes(opt);
            html += `
              <div onclick="toggleMultipleOption('${q.id}', '${escapeHtml(opt)}')" 
                class="option-card p-4 rounded-xl flex items-center justify-between ${isSelected ? 'selected' : ''}">
                <span class="text-sm sm:text-base font-medium text-white/90">${opt}</span>
                <div class="w-5 h-5 rounded-md border border-white/30 flex items-center justify-center ${isSelected ? 'border-brand-green1 bg-brand-green1' : ''}">
                  ${isSelected ? `<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>` : ''}
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }
        else if (q.type === 'rating') {
          const selectedRating = answers[q.id] || 0;
          html += `
            <div class="flex flex-col items-center justify-center my-8">
              <div class="flex items-center justify-center gap-3 sm:gap-5" id="star-rating-container">
          `;
          for (let i = q.min; i <= q.max; i++) {
            const isFilled = i <= selectedRating;
            html += `
              <button type="button" 
                onclick="selectRating('${q.id}', ${i})"
                onmouseenter="hoverRating(${i})"
                onmouseleave="resetHoverRating(${selectedRating})"
                class="star-btn flex flex-col items-center gap-2 group cursor-pointer transition-all focus:outline-none"
                data-star-index="${i}">
                <div class="star-icon transition-all duration-200 ${isFilled ? 'text-amber-400 scale-110 drop-shadow-[0_0_14px_rgba(251,191,36,0.6)]' : 'text-white/20 group-hover:text-amber-400/60'}">
                  <svg class="w-10 h-10 sm:w-14 sm:h-14" fill="${isFilled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
                  </svg>
                </div>
                <span class="star-label text-xs sm:text-sm font-bold ${isFilled ? 'text-amber-400' : 'text-white/40 group-hover:text-amber-400/80'}">${i}</span>
              </button>
            `;
          }
          html += `
              </div>
            </div>
          `;
        }
        else if (q.type === 'select') {
          const val = answers[q.id] || '';
          html += `
            <div class="mt-4">
              <select id="select-q-${q.id}" onchange="saveAnswer('${q.id}', this.value)"
                class="form-input-glass w-full px-5 py-4 rounded-xl text-base font-medium bg-[#010A15] cursor-pointer">
                <option value="" disabled ${!val ? 'selected' : ''}>Selecione uma opção...</option>
                ${q.options.map(opt => `<option value="${escapeHtml(opt)}" ${val === opt ? 'selected' : ''} class="bg-[#010A15] text-white">${opt}</option>`).join('')}
              </select>
            </div>
          `;
        }
        else if (q.type === 'textarea') {
          const val = answers[q.id] || '';
          html += `
            <div class="mt-4">
              <textarea id="textarea-q-${q.id}" rows="4" placeholder="${q.placeholder || ''}"
                oninput="saveAnswer('${q.id}', this.value)"
                class="form-input-glass w-full px-5 py-4 rounded-xl text-base placeholder-white/40 font-medium resize-none">${escapeHtml(val)}</textarea>
            </div>
          `;
        }

        formContainer.innerHTML = html;
        formContainer.className = 'step-content step-active';
      }, 50);
    }

    // INTERACTION HELPERS
    function saveAnswer(key, value) {
      answers[key] = value;
    }

    function selectSingleOption(qId, optionValue, cardElem) {
      answers[qId] = optionValue;
      if (cardElem) {
        const container = cardElem.parentElement;
        if (container) {
          container.querySelectorAll('.option-card').forEach(c => {
            c.classList.remove('selected');
          });
          cardElem.classList.add('selected');
        }
      }

      setTimeout(() => {
        if (currentStep < questions.length - 1) {
          nextQuestion();
        } else {
          finishForm();
        }
      }, 200);
    }

    function toggleMultipleOption(qId, optionValue) {
      if (!answers[qId]) answers[qId] = [];
      const index = answers[qId].indexOf(optionValue);
      if (index > -1) {
        answers[qId].splice(index, 1);
      } else {
        answers[qId].push(optionValue);
      }
      renderQuestion(currentStep, 'next');
    }

    function selectRating(qId, ratingVal) {
      answers[qId] = ratingVal;
      hoverRating(ratingVal);

      setTimeout(() => {
        if (currentStep < questions.length - 1) {
          nextQuestion();
        } else {
          finishForm();
        }
      }, 200);
    }

    function hoverRating(hoverVal) {
      const container = document.getElementById('star-rating-container');
      if (!container) return;
      const buttons = container.querySelectorAll('.star-btn');
      buttons.forEach((btn, idx) => {
        const starNum = idx + 1;
        const starIcon = btn.querySelector('.star-icon');
        const svg = btn.querySelector('svg');
        const label = btn.querySelector('.star-label');
        if (starNum <= hoverVal) {
          starIcon.className = 'star-icon transition-all duration-200 text-amber-400 scale-110 drop-shadow-[0_0_14px_rgba(251,191,36,0.6)]';
          svg.setAttribute('fill', 'currentColor');
          label.className = 'star-label text-xs sm:text-sm font-bold text-amber-400';
        } else {
          starIcon.className = 'star-icon transition-all duration-200 text-white/20';
          svg.setAttribute('fill', 'none');
          label.className = 'star-label text-xs sm:text-sm font-bold text-white/40';
        }
      });
    }

    function resetHoverRating(selectedVal) {
      hoverRating(selectedVal || 0);
    }

    // NAVIGATION
    function nextQuestion() {
      const q = questions[currentStep];

      // Simple Validation check
      if (q.required) {
        if (q.type === 'contact') {
          if (!answers[`${q.id}_email`] || !answers[`${q.id}_phone`]) {
            showToast("Por favor, preencha o e-mail e o WhatsApp para continuar.");
            return;
          }
        } else if (q.type === 'multiple') {
          if (!answers[q.id] || answers[q.id].length === 0) {
            showToast("Selecione pelo menos uma opção para continuar.");
            return;
          }
        } else {
          if (!answers[q.id]) {
            showToast("Por favor, responda esta pergunta antes de avançar.");
            return;
          }
        }
      }

      if (currentStep < questions.length - 1) {
        currentStep++;
        renderQuestion(currentStep, 'next');
      } else {
        finishForm();
      }
    }

    function prevQuestion() {
      if (currentStep > 0) {
        currentStep--;
        renderQuestion(currentStep, 'prev');
      } else if (currentStep === 0) {
        currentStep = -1;
        renderWelcomeScreen('prev');
      }
    }

    // FINISH FORM SCREEN & SUBMISSION
    async function finishForm() {
      navControls.style.display = 'none';
      stepCounterText.textContent = "Concluído";
      progressBar.style.width = "100%";

      // Show Loading Screen
      formContainer.className = 'step-content step-enter';
      setTimeout(() => {
        formContainer.innerHTML = `
          <div class="text-center py-12">
            <div class="w-14 h-14 border-4 border-brand-green1 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
            <h2 class="text-xl sm:text-2xl font-bold font-display text-white mb-2">Enviando suas respostas...</h2>
            <p class="text-xs text-white/60">Aguarde um instante enquanto salvamos seus dados.</p>
          </div>
        `;
        formContainer.className = 'step-content step-active';
      }, 50);

      // Prepare payload
      const payload = {
        timestamp: new Date().toLocaleString('pt-BR'),
        answers: questions.map(q => {
          let answerVal = '';
          if (q.type === 'contact') {
            const email = answers[`${q.id}_email`] || '';
            const phone = answers[`${q.id}_phone`] || '';
            answerVal = `E-mail: ${email} | WhatsApp: ${phone}`;
          } else if (q.type === 'multiple') {
            answerVal = (answers[q.id] || []).join(', ');
          } else {
            answerVal = answers[q.id] || '';
          }
          return {
            id: q.id,
            title: q.title.replace(/<[^>]*>/g, ''),
            answer: answerVal
          };
        })
      };

      // Send data to Apps Script Web App URL if configured
      if (WEB_APP_URL && WEB_APP_URL.trim() !== "") {
        try {
          await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error("Erro ao enviar dados para a planilha:", err);
        }
      } else {
        console.log("URL do Apps Script não configurada no WEB_APP_URL. Payload coletado:", payload);
      }

      // Show Final Thank You Screen
      setTimeout(() => {
        formContainer.className = 'step-content step-enter';
        setTimeout(() => {
          formContainer.innerHTML = `
            <div class="text-center py-8">
              <div class="w-20 h-20 bg-brand-green1/20 border-2 border-brand-green1 text-brand-deep rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-brand-green1/20 animate-bounce">
                <svg class="w-10 h-10 text-brand-deep" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </div>

              <h2 class="text-2xl sm:text-3xl font-bold font-display text-white mb-3">
                Obrigado por responder!
              </h2>
              <p class="text-base text-white/70 max-w-md mx-auto mb-3">
                Suas respostas foram registradas com&nbsp;sucesso.
              </p>
              <p class="text-base text-white/70 max-w-md mx-auto mb-6">
                Estamos ansiosos para te ver no próximo evento da Ambiental Pro!
              </p>
              <p class="text-xs sm:text-sm text-white/40 max-w-md mx-auto pt-2 border-t border-white/10">
                Pode fechar essa página.
              </p>
            </div>
          `;
          formContainer.className = 'step-content step-active';
        }, 50);
      }, 800);
    }

    // TOAST NOTIFICATION FOR VALIDATION
    function showToast(msg) {
      const existing = document.getElementById('form-toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = 'form-toast';
      toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-red-600/90 text-white text-xs font-semibold px-5 py-3 rounded-xl shadow-xl z-50 backdrop-blur-md border border-red-400/30 transition-all';
      toast.textContent = msg;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // KEYBOARD NAVIGATION (Enter to advance)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && currentStep < questions.length) {
        const activeElem = document.activeElement;
        // Allow newline in textarea
        if (activeElem && activeElem.tagName === 'TEXTAREA') return;
        
        e.preventDefault();
        nextQuestion();
      }
    });

    // UTILS
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>

</body>

</html>
